<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Check-in</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 60px auto; padding: 20px; background: #f7f9fc; color: #222; }
    h1 { font-size: 1.4rem; }
    textarea { width: 100%; height: 80px; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 20px; font-size: 1rem; background: #2d6cdf; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #result { margin-top: 20px; padding: 16px; background: white; border-radius: 8px; border: 1px solid #e0e0e0; min-height: 60px; white-space: pre-wrap; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>How are you feeling right now?</h1>
  <textarea id="input" placeholder="Type a sentence about how you feel..."></textarea>
  <button id="btn" onclick="checkMood()">Check in</button>
  <div id="result"></div>
  <p class="hint">This is not therapy. If you're in crisis, please contact a local helpline.</p>

  <script>
const WORKER_URL = "https://mood-checkin-proxy.smileyevanj.workers.dev";

async function checkMood() {
  const input = document.getElementById('input').value.trim();
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  if (!input) return;

  btn.disabled = true;
  result.textContent = 'Thinking...';

  const prompt = `You are a supportive but non-clinical mood check-in assistant.
The user says: "${input}"
Respond in this exact format:
Mood: [one or two words]
Tip: [one short, practical coping suggestion, max 2 sentences]
If the text suggests crisis or self-harm, replace the Tip with a helpline referral message instead.`;

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });
    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response.';
    result.textContent = text;
  } catch (e) {
    result.textContent = 'Something went wrong.';
  } finally {
    btn.disabled = false;
  }
}
  </script>
</body>
</html>
